# Cabeceras HTTP de seguridad del frontend.
# La política de contenido principal (CSP) está en el <meta> de index.html;
# aquí se añaden las directivas que solo funcionan como cabecera HTTP.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'none'" always;
