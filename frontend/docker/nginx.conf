# Servidor web del frontend de PassForge (solo archivos estáticos).
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No revelar la versión de nginx en cabeceras ni páginas de error.
    server_tokens off;

    # Cabeceras de seguridad para todas las respuestas.
    include /etc/nginx/snippets/security-headers.conf;

    # Health check para Docker, el pipeline y, más adelante, el balanceador (CD).
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # config.js se genera al arrancar el contenedor: no debe quedar en caché.
    # (Un add_header dentro de un location anula los del server, por eso se
    # vuelven a incluir las cabeceras de seguridad).
    location = /js/config.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
