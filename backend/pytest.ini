[pytest]
# Permite "from app import ..." sin instalar el paquete.
pythonpath = .
testpaths = tests
markers =
    e2e: pruebas de aceptación que abren un navegador real (Playwright).
filterwarnings =
    # Aviso interno del plugin pytest-playwright, no de nuestro código.
    ignore:Session-scoped fixtures defined as instance methods:pytest.PytestRemovedIn10Warning
