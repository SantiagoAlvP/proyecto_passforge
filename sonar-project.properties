# Configuración del análisis en SonarCloud.
# IMPORTANTE: copia el Project Key y la Organization exactos desde SonarCloud
# (Information del proyecto) si son distintos a estos.
sonar.projectKey=SantiagoAlvP_proyecto_passforge
sonar.organization=santiagoalvp
sonar.projectName=PassForge

# Código de la aplicación (los dos componentes) y código de pruebas.
sonar.sources=backend/app,backend/wsgi.py,frontend
sonar.tests=backend/tests,acceptance
sonar.exclusions=**/*.md,docs/**,.github/**,**/htmlcov/**

# Python y reportes generados por el pipeline.
sonar.python.version=3.13
sonar.python.pylint.reportPaths=pylint-report.txt
sonar.python.flake8.reportPaths=flake8-report.txt
sonar.python.coverage.reportPaths=backend/coverage.xml

# Fuera de la medición de cobertura:
#  - wsgi.py: solo es el punto de entrada (se valida al arrancar el contenedor).
#  - frontend: JavaScript sin pruebas unitarias; se valida con las pruebas de
#    aceptación (Selenium), que recorren la interfaz completa en un navegador.
sonar.coverage.exclusions=backend/wsgi.py,frontend/**

# El análisis falla si el Quality Gate no es "Passed".
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
